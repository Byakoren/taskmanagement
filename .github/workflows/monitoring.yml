name: Monitoring - Healthcheck

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed backend health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL secret is missing."
            exit 1
          fi

          echo "Healthcheck URL: $HEALTHCHECK_URL"
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" "$HEALTHCHECK_URL")
          cat response.json

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Healthcheck failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Healthcheck passed."
